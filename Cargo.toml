[package]
name = "ngxd"
version = "0.1.0"
edition = "2024"
description = "A Paperless-ngx folder upload daemon"
rust-version = "1.92"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
directories = "6"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
